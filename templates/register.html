<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>register</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #080b1a;
      color: white;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, #5b21b6 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #0891b2 0%, transparent 30%),
        #080b1a;
      z-index: -2;
    }

    /* Register card */
    .register-card {
      width: 400px;
      padding: 40px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .register-card h1 {
      font-size: 34px;
      margin-bottom: 8px;
      background: linear-gradient(
        90deg,
        #00f5ff,
        #c084fc,
        #ff4ecd
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .register-card > p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Input fields */
    .input-box {
      position: relative;
      margin-bottom: 18px;
    }

    .input-box input {
      width: 100%;
      padding: 15px 18px;
      border: none;
      outline: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: 0.3s;
    }

    .input-box input::placeholder {
      color: #aab3c5;
    }

    .input-box input:focus {
      border-color: #00eaff;
      box-shadow: 0 0 15px rgba(0, 234, 255, 0.3);
    }

    /* Terms */
    .terms {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      margin: 5px 0 22px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .terms input {
      accent-color: #06b6d4;
      cursor: pointer;
    }

    .terms a {
      color: #67e8f9;
      text-decoration: none;
    }

    /* Register button */
    .register-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-size: 16px;
      font-weight: bold;

      background: linear-gradient(
        90deg,
        #06b6d4,
        #7c3aed,
        #ec4899
      );

      background-size: 200% 200%;
      transition: 0.3s;
      animation: gradient 4s ease infinite;
    }

    .register-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 10px 30px rgba(124, 58, 237, 0.5);
    }

    /* Login link */
    .login {
      margin-top: 25px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .login a {
      color: #67e8f9;
      text-decoration: none;
      font-weight: bold;
    }

    /* Gradient animation */
    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating decorative circles */
    .circle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.25;
    }

    .circle.one {
      width: 120px;
      height: 120px;
      background: #22d3ee;
      top: 10%;
      left: 10%;
      animation: float 6s ease-in-out infinite;
    }

    .circle.two {
      width: 90px;
      height: 90px;
      background: #f472b6;
      bottom: 12%;
      right: 12%;
      animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-30px);
      }
    }

    /* Mobile */
    @media (max-width: 450px) {
      .register-card {
        width: 90%;
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <!-- Decorative objects -->
  <div class="circle one"></div>
  <div class="circle two"></div>

  <!-- Register Form -->
  <div class="register-card">

    <h1>Create Account</h1>

    <p>Register to create your new account</p>

    <form id="registerForm">

      <!-- Username -->
      <div class="input-box">
        <input
          type="text"
          id="registerUsername"
          placeholder="Username"
          required
        >
      </div>

      <!-- Email -->
      <div class="input-box">
        <input
          type="email"
          id="registerEmail"
          placeholder="Email address"
          required
        >
      </div>

      <!-- Password -->
      <div class="input-box">
        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          required
          minlength="6"
        >
      </div>

      <!-- Confirm Password -->
      <div class="input-box">
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          required
          minlength="6"
        >
      </div>

      <!-- Terms -->
      <div class="terms">
        <input type="checkbox" id="terms" required>

        <label for="terms">
          I agree to the
          <a href="#">Terms & Conditions</a>
        </label>
      </div>

      <!-- Register Button -->
      <button class="register-btn" type="submit">
        Create Account
      </button>

      <p id="registerMessage"></p>

    </form>

    <!-- Login Link -->
    <div class="login">
      Already have an account?
      <a href="/login">Sign In</a>
    </div>

  </div>


<script>
  

    const registerForm = document.getElementById("registerForm");

    if (registerForm) {

        registerForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document.getElementById("registerUsername").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;


            // Check passwords
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }


            const response = await fetch("/api/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            });

            const result = await response.json();

            const message = document.getElementById("registerMessage");

            message.textContent = result.message;

            if (result.success) {

              alert("registration success, now login");
              window.location.href = "/login";
              registerForm.reset();
            }
        });
    }

</script>

</body>
</html>
